server.port=8000

# Application configuration
app.yt-dlp.binary-path=yt-dlp
app.yt-dlp.timeout-seconds=60

app.whisper.api-url=https://api.openai.com/v1/audio/transcriptions
app.whisper.api-key=${OPENAI_API_KEY:}
app.whisper.model=whisper-1

app.translation.provider=mymemory
app.translation.timeout-seconds=15

# Spring MVC configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

